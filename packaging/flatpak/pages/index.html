<h1>Refryt Flatpak repo</h1>
<p>Install refryt, a lightweight YouTube Music client, with:</p>
<p><code>flatpak install --user https://gridoe.github.io/refryt/refryt.flatpakref</code></p>
<p>Updates then come with <code>flatpak update</code> or your software centre.
