[package]
name = "refryt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A fast, native YouTube Music client"
# Two binaries live here (`refryt` and the `api-check` diagnostic), so say which one `cargo run` means.
default-run = "refryt"

[dependencies]
anyhow.workspace = true
bytes = "1"
directories.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
memmap2 = "0.9"
skrifa = "0.44"
# No `charset`: YouTube's InnerTube responses are UTF-8 JSON and the code never calls
# `text_with_charset`, so `encoding_rs` (1.6 MB) + `mime` would add size for no use.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "cookies", "http2"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The crash report's prefilled issue URL.
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ytmapi-rs.workspace = true
refryt-resolve.workspace = true
libmpv2.workspace = true
# The software render API for the in-app music video. `libmpv2`'s safe wrapper only exposes the
# OpenGL render params, so the video view drives mpv's `sw` render context directly through these
# bindings instead: one code path under any egui renderer, at the cost of a copy per frame.
libmpv2-sys = "=4.0.1"
# `blur.rs`'s backends (KDE, macOS, Windows, and the do-nothing stub for everything else)
# read the raw window/display handles eframe exposes, so this is unconditional rather than behind any
# one target's `cfg`.
raw-window-handle = "0.6"
# The system tray icon (`tray.rs`). Genuinely cross-platform — its own internal `cfg`s pick
# libappindicator on Linux, the Shell_NotifyIcon API on Windows, NSStatusItem on macOS — so this
# sits here unconditionally; only building the GTK loop it needs on Linux is target-gated below.
tray-icon = "0.25.0"
# OS media controls: MPRIS on Linux (via zbus), SMTC on Windows, Now Playing on macOS. This is
# what makes desktop/lock-screen/headset media keys work.
playwire = "1.0"
# Local music (`local.rs`): `rfd` is the native folder-picker dialog behind Settings' "Add
# folder" button, `walkdir` recursively finds audio files under it, and `lofty` reads their
# title/artist/album/duration tags.
rfd = "0.17.2"
lofty = "0.25.1"
walkdir = "2.5.0"
discord-rich-presence = "1.1"
# Folds the "styled" letters channels write titles in (𝐓𝐢𝐦𝐞𝐥𝐞𝐬𝐬, Unicode's Mathematical
# Alphanumeric Symbols) back to plain ones, which no bundled font covers. Already compiled for
# reqwest's IDNA support, at this version, so it adds nothing to the build.
icu_normalizer = "2.0.1"

# Real acrylic on KDE Wayland: asking KWin to blur what shows through. Two protocols for one
# job, both already resolved to versions already in the tree — winit pulls the same
# `wayland-client` and `wayland-protocols-plasma`, and already turns on
# `wayland-backend/client_system`, which is what the foreign-display path in `blur.rs` needs —
# so these add edges between crates already compiled, not new ones. `wayland-protocols`'
# `staging` feature is the standard `ext-background-effect-v1`: what KWin 6.7 offers after it
# dropped `org_kde_kwin_blur` outright (see `blur.rs`), and what niri and Mutter 51 speak. The
# plasma crate's `org_kde_kwin_blur` is the fallback for Plasma 6.6 and earlier.
# glibc's allocator controls (`memory.rs`). `libc` is already in the tree: an edge onto the crate
# the rest of the graph compiles, not a new one.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Pinned to the exact version `gtk` itself already pulls in, so this is an edge onto a crate
# already compiled rather than a second copy — `MainContext::channel` is `tray.rs`'s way to
# toggle the tray icon's visibility from another thread without rebuilding it (GTK objects
# can't cross threads, so the icon lives on `gtk`'s own thread and this is how it's told).
glib = "0.18.5"
# Winit doesn't run GTK's own event loop, and `tray-icon`'s Linux backend (libappindicator) needs
# one — see `tray.rs`'s own doc comment for why that means a dedicated thread.
gtk = "0.18.2"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
# The in-app sign-in window (`webview_login.rs`) on Linux: WebKitGTK through wry's `build_gtk`,
# which embeds the widget in an ordinary GTK window. Not the default `x11` feature — that is the
# tao/foreign-X11-window path, which is X11-only and comes up blank on some driver stacks; see
# the module doc. Building needs `webkit2gtk-4.1` and `libsoup-3.0` development packages, which
# most desktops already carry; the AppImage does not bundle WebKitGTK, so the host's is used.
wry = { version = "0.57", default-features = false, features = ["os-webview"] }



# Pinned to 0.52, the version winit itself already resolves to on Windows, so this is an edge
# onto an already-compiled crate rather than a second copy of it.
[target.'cfg(target_os = "windows")'.dependencies]
# The in-app sign-in window (`webview_login.rs`). WebView2 is the one browser whose cookie store
# this app is allowed to read on Windows: Chromium's App-Bound Encryption makes Chrome/Edge/Brave's
# own stores unreadable to any other process (yt-dlp#10927), and Google no longer accepts OAuth on
# the YouTube Music API (ytmusicapi#676, yt-dlp#11462), so asking a browser we own stays the only
# path. `tao` is the event loop its window needs. WebView2 itself is a Windows component, but the
# GNU target links the loader dynamically, so `WebView2Loader.dll` ships next to the exe the same
# way `libmpv-2.dll` already does.
wry = "0.57"
tao = "0.37"
# `-System_Registry`/`-Security` are `autostart`'s per-user `Run` key; `-UI_Shell` /
# `-UI_WindowsAndMessaging` are `open_url`'s `ShellExecuteW`. `-Graphics_Dwm`, `-Graphics_Gdi` and
# `-UI_Controls` are `blur.rs`: the acrylic backdrop, the rounded corners, and the black
# redirection surface that lets the transparent shell show the desktop.
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows renders through wgpu, for two reasons. Transparency: DX12's DirectComposition swapchain
# (set up in `main.rs`) is the one presentation path there with per-pixel alpha. And stability:
# the glow/WGL path presents whole-window black
# frames under load on Windows (reproduced: scrolling an artist page while covers upload gives
# uniform black frames every so often, while the same build on wgpu does not). eframe's
# `Renderer::default()` picks wgpu automatically the moment both backends are compiled in, so no
# code change selects it; Linux keeps glow, chosen there for its much smaller dependency tree.
eframe = { workspace = true, features = ["wgpu"] }

# The in-app sign-in window (`webview_login.rs`) on macOS: WKWebView through wry, with tao's event
# loop in the child process that exists for the window.
[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.57"
tao = "0.37"
# `tray.rs` brings the window back through AppKit directly: a hidden or minimized window gets no
# frames from winit on macOS, so the frame loop cannot be what notices a tray click. Same
# versions winit already resolves to, so these are edges onto crates already compiled.
# macOS renders through wgpu (Metal), like Windows: eframe's glow path runs on Apple's
# OpenGL-on-Metal translation layer, which holds ~126 MB of IOSurface buffers for a transparent
# Retina window (measured), and OpenGL is deprecated there. `Renderer::default()` picks wgpu as
# soon as both backends are compiled in.
eframe = { workspace = true, features = ["wgpu"] }
objc2 = "0.6"
dispatch2 = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSView",
    "NSScreen", "NSButton", "NSControl",
] }
# `window_fullscreen.rs` saves and restores the window frame (an `NSRect`); `webview_login.rs`
# asks `NSProcessInfo` whether this macOS has named WebKit data stores (14 and later); `chrome.rs`
# reads the system's title-bar double-click preference.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSGeometry", "NSProcessInfo", "NSString", "NSUserDefaults",
] }

# Embeds refryt.ico as the .exe's own icon resource (build.rs) — unconditional, not under a
# `cfg(target_os = "windows")` table: build scripts always compile for the *host*, so a
# target-cfg'd build-dependency is checked against the host, not `--target`, and would vanish
# outright when cross-compiling for Windows from Linux. `build.rs` itself is what skips the
# actual work on every other target, via `CARGO_CFG_TARGET_OS`.
[build-dependencies]
embed-resource = "3.0.11"
